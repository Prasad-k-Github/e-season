name: e_season
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.0.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.3.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_database: ^11.3.5
  crypto: ^3.0.1
  bcrypt: ^1.1.3
  google_sign_in: ^6.3.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/google_logo.png
    - assets/images/train_logo.png
    - assets/images/E-Season2.png
    - assets/images/ES.jpg
    - assets/images/ES.png
    - assets/images/background01.jpg
    - assets/images/background02.jpg
    - .env

  fonts:
    - family: Railway
      fonts:
        - asset: assets/fonts/railway.regular.otf
          weight: 400
