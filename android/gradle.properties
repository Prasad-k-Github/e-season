org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Project is on F: but the pub cache is on C:, which breaks Kotlin's incremental caches.
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1G
# Low-RAM machine: keep one build process and avoid a second daemon.
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
